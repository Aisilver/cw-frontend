<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/logo.png">
    <link rel="stylesheet" href="/icon-plugins/all.min.css">
    <link rel="stylesheet" href="/styles/ping-component-style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfterClass</title>
  </head>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    *::-webkit-scrollbar {
      width: 8px;
      display: block;
    }

    *::-webkit-scrollbar-track {
      background: transparent;
    }

    *::-webkit-scrollbar-thumb {
      background-color: #5139d5;
      border-radius: 10px;
      cursor: pointer;
    }

    input[type="password"]::-webkit-reveal, input[type="password"]::-ms-reveal {
      display: none;
    }
      
    @media (max-width: 500px) {
      *::-webkit-scrollbar {
        width: 5px;
      }
    }

  </style>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script src="/icon-plugins/all.min.js"></script>
  </body>
</html>
